<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Search</title>
          <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
          <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <form action="https://www.google.com/search" method="get">
        <div class="cont">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <p id="logo">Google</p>
                    </div>
            </div>
            <div class="row" >
                <div class="col-2"></div>
                <div class="col-8"><input type="text" name="q" style="width: 100%;height: 6vh;border-radius:24px;"></div>
                <div class="col-2"></div>
            </div>
            <div class="row">
                <div class="col-2"></div>
                <div class="col-4"><input type="submit" value="Google Search" style="display: block;margin-left: auto;"></div>
                <div class="col-4"><input type="submit" value="I am feeling lucky" style="display: block;margin-right: auto;"></div>
                <div class="col-2"></div>
            </div>
            
        </div>
        </div>
        <div style="height: 10vh; width: 100vw;position: absolute;bottom:0px;background-color:#e8e8e8;">
            <hr>
        </div>
        </form>
    </body>
</html>
